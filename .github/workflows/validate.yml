name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Offline package and runner contracts
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Dry-run Max and capable finishing
        run: |
          python3 scripts/run_codex_agent.py run --role worker --effort max --cwd . --prompt "Offline check only." --dry-run
          python3 scripts/run_codex_agent.py run --role complex-worker --cwd . --prompt "Offline finisher check only." --dry-run
